aid: altinity
name: Altinity
description: >-
  Altinity is the enterprise provider for open-source ClickHouse, the real-time
  analytical database. It builds and operates Altinity.Cloud, a fully managed
  ClickHouse service available on AWS, GCP, Azure and Hetzner, plus a
  bring-your-own-cloud (BYOC) option, and delivers 24/7 expert support,
  performance tuning, and training. Altinity is a leading ClickHouse contributor
  and maintains widely used open-source tooling including the Altinity Kubernetes
  Operator for ClickHouse, clickhouse-backup, the clickhouse-sink-connector, a
  Grafana datasource plugin, Altinity Stable Builds, and an official MCP server
  for AI agents. Its Altinity Cloud Manager (ACM) exposes a REST API for managing
  environments and ClickHouse clusters programmatically.
